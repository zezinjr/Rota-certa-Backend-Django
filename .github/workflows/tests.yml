name: Testes do backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores só para o CI; não há .env no runner.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-0123456789
      DATABASE_URL: sqlite:///db.sqlite3
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuração do Django
        run: python manage.py check

      - name: Verificar migrações pendentes
        # Falha se algum model mudou sem a migração correspondente.
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar testes
        run: python manage.py test --verbosity 2

      - name: Smoke test do seed de demonstração
        run: |
          python manage.py migrate --verbosity 0
          python manage.py seed_manaus_demo
