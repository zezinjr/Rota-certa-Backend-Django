# Evolution API para os avisos pelo WhatsApp (ver "Avisos pelo WhatsApp" no README).
# Na pasta do backend:
#   docker compose -f docker/evolution/docker-compose.yml --env-file .env up -d
# Usa a EVOLUTION_API_KEY do .env do backend. A API fica só em http://localhost:8080.
name: rotacerta-evolution

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env do backend}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: rotacerta
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Rota Certa
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution  # só acessível dentro desta rede do Docker
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
